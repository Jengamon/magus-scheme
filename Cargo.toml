[workspace]
resolver = "2"
members = [".", "datatest_parse", "magus_format", "magus_repl", "magus_web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.93"
codesnake = "0.2.1"
yansi = { version = "1.0.1", features = ["detect-env", "detect-tty"] }

[package]
name = "magus"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "R7RS-scheme implementation in Rust using gc-arena"

[[test]]
name = "datatests"
harness = false

[[bench]]
name = "library_name"
harness = false

[dependencies]
anyhow.workspace = true
arbitrary = { version = "1", features = ["derive"] }
codesnake.workspace = true
either = "1.14.0"
fxhash = "0.2.1"
gc-arena = { git = "https://github.com/kyren/gc-arena", rev = "d651e3b4363d525a2d502c2305bc73e291835c84" }
icu_casemap = "1.5.1"
im-rc = "15.1.0"
lasso = { version = "0.7.2" }
logos = { version = "0.15" }
num = { version = "0.4.3", features = ["num-bigint"] }
paste = "1.0.15"
rowan = "0.16"
slotmap = "1.0.7"
target-lexicon = "0.13.2"
target-triple = "0.1.4"
thiserror = "2"
unicode-general-category = "1.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yansi.workspace = true

[dev-dependencies]
arbtest = "0.3.1"
assert2 = "0.3.15"
datatest-stable = "0.3.2"
datatest_parse = { path = "datatest_parse" }
divan = "0.1.17"
rstest = "0.24.0"
similar = "2.7.0"
